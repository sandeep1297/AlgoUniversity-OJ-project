services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: oj-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/onlinejudge
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend/oj
      dockerfile: Dockerfile.frontend
    container_name: oj-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    container_name: oj-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: